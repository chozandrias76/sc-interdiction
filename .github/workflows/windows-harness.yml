name: Windows Harness

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Harness profile to run"
        required: false
        default: "full"
        type: choice
        options:
          - full
          - quick

permissions:
  contents: read

jobs:
  windows-runner:
    name: Windows harness (${{ matrix.name }})
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            command: cargo fmt --all --check
            artifact: windows-harness-fmt
            profile: full
          - name: clippy
            command: cargo clippy --all-targets --all-features
            artifact: windows-harness-clippy
            profile: full
          - name: test
            command: cargo test --all-targets --all-features
            artifact: windows-harness-test
            profile: full
          - name: build-release
            command: cargo build --release --all-features
            artifact: windows-harness-build
            profile: full
          - name: audit
            command: cargo audit
            artifact: windows-harness-audit
            profile: full
          - name: coverage
            command: cargo llvm-cov --all-features --workspace --lcov --output-path coverage.lcov
            artifact: windows-harness-coverage
            profile: full

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Git Bash in PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gitBin = "C:\Program Files\Git\bin"
          $gitUsrBin = "C:\Program Files\Git\usr\bin"
          if (-not (Test-Path $gitBin)) {
            Write-Host "Git not found; installing via Chocolatey..."
            choco install git -y --no-progress
          }
          if (Test-Path $gitBin) {
            Add-Content $env:GITHUB_PATH $gitBin
          }
          if (Test-Path $gitUsrBin) {
            Add-Content $env:GITHUB_PATH $gitUsrBin
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Ensure Cargo in PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Test-Path $cargoBin)) {
            throw "Cargo bin directory not found at $cargoBin"
          }
          Add-Content $env:GITHUB_PATH $cargoBin

      - name: Install cargo-llvm-cov
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install cargo-llvm-cov --locked

      - name: Install cargo-audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install cargo-audit --locked

      - name: Ensure LLVM present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmConfig = Join-Path $llvmBin "llvm-config.exe"
          $libclang = Join-Path $llvmBin "libclang.dll"
          
          if (-not (Test-Path $llvmConfig) -or -not (Test-Path $libclang)) {
            Write-Host "Installing LLVM via Chocolatey..."
            choco install llvm -y --no-progress
          }
          
          if (-not (Test-Path $libclang)) {
            throw "libclang.dll not found in $llvmBin after installation"
          }

          Write-Host "LLVM verified at $llvmBin"
          Add-Content $env:GITHUB_PATH $llvmBin

      - name: Ensure PostgreSQL client libs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-LibPqPath {
            $candidates = @(
              "C:\Program Files\PostgreSQL",
              "C:\Program Files (x86)\PostgreSQL"
            )
            $pgConfig = Get-Command pg_config -ErrorAction SilentlyContinue
            if ($pgConfig) {
              $pgLibDir = & $pgConfig.Source --libdir 2>$null
              if ($pgLibDir -and (Test-Path (Join-Path $pgLibDir "libpq.lib"))) {
                return $pgLibDir
              }
            }
            foreach ($root in $candidates) {
              if (-not (Test-Path $root)) {
                continue
              }
              $libCandidate = Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName "lib" } |
                Where-Object { Test-Path (Join-Path $_ "libpq.lib") } |
                Select-Object -First 1
              if ($libCandidate) {
                return $libCandidate
              }
            }
            $vcpkgRoot = Join-Path $env:USERPROFILE "vcpkg"
            $vcpkgLib = Join-Path $vcpkgRoot "installed\x64-windows\lib"
            if (Test-Path (Join-Path $vcpkgLib "libpq.lib")) {
              return $vcpkgLib
            }
            return $null
          }
          function Ensure-VcpkgLibPq {
            $vcpkgRoot = Join-Path $env:USERPROFILE "vcpkg"
            if (-not (Test-Path $vcpkgRoot)) {
              git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            }
            $bootstrap = Join-Path $vcpkgRoot "bootstrap-vcpkg.bat"
            if (-not (Test-Path $bootstrap)) {
              throw "vcpkg bootstrap script not found at $bootstrap"
            }
            & $bootstrap
            $vcpkgExe = Join-Path $vcpkgRoot "vcpkg.exe"
            if (-not (Test-Path $vcpkgExe)) {
              throw "vcpkg executable not found at $vcpkgExe"
            }
            & $vcpkgExe install libpq:x64-windows
            return $vcpkgRoot
          }

          $pgLib = Find-LibPqPath
          if (-not $pgLib) {
            Write-Host "libpq.lib not found locally; installing via vcpkg..."
            $vcpkgRoot = Ensure-VcpkgLibPq
            $pgLib = Find-LibPqPath
            if ($pgLib) {
              Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$vcpkgRoot"
              Add-Content $env:GITHUB_ENV "VCPKG_DEFAULT_TRIPLET=x64-windows"
            }
          }

          if (-not $pgLib) {
            throw "libpq.lib not found after vcpkg installation. Checked Program Files and vcpkg paths."
          }

          $pgRoot = Split-Path -Parent $pgLib
          $pgBin = Join-Path $pgRoot "bin"
          $pgInclude = Join-Path $pgRoot "include"
          if (Test-Path $pgBin) {
            Add-Content $env:GITHUB_PATH $pgBin
          }
          Add-Content $env:GITHUB_ENV "LIB=$pgLib;$env:LIB"
          Add-Content $env:GITHUB_ENV "PQ_LIB_DIR=$pgLib"
          if (Test-Path $pgInclude) {
            Add-Content $env:GITHUB_ENV "PQ_INCLUDE_DIR=$pgInclude"
          }

      - name: Run command
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.mode }}' -ne '${{ matrix.profile }}' -and '${{ inputs.mode }}' -ne 'full') {
            Write-Host "Skipping ${{ matrix.name }} for mode=${{ inputs.mode }}"
            exit 0
          }
          $command = "${{ matrix.command }}"
          Write-Host "Running: $command"
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            throw "cargo not found in PATH"
          }
          $logPath = "${{ matrix.artifact }}.log"
          New-Item -Path $logPath -ItemType File -Force | Out-Null
          cmd /c $command 2>&1 | Tee-Object -FilePath $logPath
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Command failed with exit code $LASTEXITCODE"
            Get-Content $logPath -ErrorAction SilentlyContinue | Select-Object -Last 200
            exit $LASTEXITCODE
          }

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.log

      - name: Upload coverage artifact
        if: always() && matrix.name == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-lcov
          path: coverage.lcov
