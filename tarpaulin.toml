[default]
# Exclude crates from coverage that are CLI tools or have external dependencies
exclude = [
    "sc-data-extractor",
    "dataforge-explorer",
    "sc-logistics-importer",
    "scunpacked-explorer",
]

# Exclude specific file patterns from coverage
exclude-files = [
    "crates/sc-data-extractor/src/*",
    "crates/cli/src/main.rs",
    "crates/dataforge-explorer/src/*",
    "crates/sc-logistics-importer/src/*",
    "crates/scunpacked-explorer/src/*",
]

# Output format
out = ["Stdout"]

# Fail if coverage drops below threshold
# Target is 80%, but we allow 79% as a buffer for static initialization code
# that's difficult to cover in tests (LazyLock, helper functions called once)
fail-under = 79.0
